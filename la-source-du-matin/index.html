button,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:22px 20px 90px}
.kick{text-align:center;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.day{text-align:center;font-size:.92rem;color:var(--muted);text-transform:capitalize;margin-top:2px}
h1{text-align:center;font:500 2.3rem var(--serif);margin:6px 0 18px}
.vcard{background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px -10px rgba(79,122,98,.35)}
.vt{font:500 1.4rem/1.5 var(--serif)}
.vr{margin-top:14px;font-weight:600;font-size:.92rem;letter-spacing:.03em;color:var(--green)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pb{border-radius:999px;padding:9px 18px;font-size:.92rem;cursor:pointer;border:1px solid rgba(63,122,94,.35);background:transparent}
.pb.on{background:var(--green);color:#f6f7f0;border-color:var(--green)}
h2{font:500 1.75rem var(--serif);margin:30px 0 6px}
.refl{color:var(--muted);line-height:1.7;white-space:pre-wrap}
.thought{margin-top:16px;border-left:2px solid var(--green);padding-left:14px;color:var(--muted)}
.by{text-align:right;font-size:.76rem;color:var(--muted);margin-top:10px}
.silence{margin-top:28px;background:rgba(214,230,218,.86);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.clock{font:500 3.2rem var(--serif);font-variant-numeric:tabular-nums}
.clock.run{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.5}}
.durs{display:flex;gap:8px}
.durs button{border:0;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.85);cursor:pointer}
.durs button.on{background:var(--green);color:#fff}
.prayer{margin-top:30px;border-left:2px solid var(--green);padding-left:18px}
.prayer h2{margin-top:0}
.prayer p{font-style:italic;line-height:1.75;white-space:pre-wrap}
.notes{margin-top:30px;background:var(--card);border-radius:24px;padding:20px}
.notes h2{margin:0 0 2px}
.notes .hint{font-size:.88rem;color:var(--muted);margin:0 0 10px}
.notes textarea{width:100%;min-height:200px;border:1px solid rgba(63,122,94,.25);border-radius:14px;padding:14px;background:rgba(255,255,255,.9);line-height:1.6;resize:vertical}
.notes .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.saved{font-size:.82rem;color:var(--muted)}
.foot{margin-top:36px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot a,.link{color:var(--green);font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;font-size:.95rem}
.top{display:flex;justify-content:space-between;margin-bottom:12px}
.chip{background:rgba(255,255,255,.65);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.item{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.item .d{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item .r{font:600 1.15rem var(--serif);color:var(--green);margin:2px 0 6px}
.item .n{white-space:pre-wrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.don{background:var(--card);border-radius:24px;padding:26px 22px;text-align:center}
.don p{color:var(--muted)}
.big{display:inline-block;margin-top:10px;background:var(--green);color:#fff;border-radius:999px;padding:13px 28px;font-weight:600;text-decoration:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

le. Elle ne dépend pas des circonstances, mais de la présence du Christ en nous.", "prayer": "Père, je te confie mes besoins et je te remercie pour tes bienfaits. Que ta paix garde mon cœur. Amen."}, {"ref": "Ésaïe 41:10", "text": "Ne crains rien, car je suis avec toi ; ne promène pas des regards inquiets, car je suis ton Dieu ; je te fortifie, je viens à ton secours.", "reflection": "Vous n'êtes jamais seul. Dieu est votre force dans chaque épreuve.", "prayer": "Seigneur, quand j'ai peur, rappelle-moi que tu es avec moi. Fortifie-moi aujourd'hui. Amen."}, {"ref": "Jean 14:27", "text": "Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble point.", "reflection": "La paix du Christ ne dépend pas des circonstances. Accueillez-la maintenant.", "prayer": "Jésus, remplis-moi de ta paix, celle que le monde ne peut pas donner. Amen."}, {"ref": "Psaume 46:11", "text": "Arrêtez, et sachez que je suis Dieu.", "reflection": "Faites silence un instant. Laissez Dieu être Dieu dans votre vie.", "prayer": "Seigneur, j'arrête mon agitation pour te reconnaître. Tu es Dieu, et je me repose en toi. Amen."}, {"ref": "Proverbes 3:5-6", "text": "Confie-toi en l'Éternel de tout ton cœur, et ne t'appuie pas sur ta sagesse ; reconnais-le dans toutes tes voies, et il aplanira tes sentiers.", "reflection": "Dans quelle décision avez-vous besoin de faire confiance à Dieu ?", "prayer": "Père, je te fais confiance plus qu'à ma propre sagesse. Dirige mes pas. Amen."}, {"ref": "Lamentations 3:22-23", "text": "Les bontés de l'Éternel ne sont pas épuisées, ses compassions ne sont pas à leur terme ; elles se renouvellent chaque matin.", "reflection": "Chaque jour est un nouveau départ dans la fidélité de Dieu.", "prayer": "Merci Seigneur pour tes compassions renouvelées ce jour. Grande est ta fidélité. Amen."}];

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("Copié ✓"); }catch(e){ toast("Copie impossible ici"); } }

function verseOfDay(d){
  const k=iso(d); const dated=VERSES.find(v=>v.date===k); if(dated) return dated;
  const und=VERSES.filter(v=>!v.date); const day=Math.floor(d.getTime()/86400000), base=VERSES.indexOf(und[0]);
  return VERSES[(base+(day%und.length))%VERSES.length];
}
const refOf=v=>v.ref+" ("+(v.version||BIBLE_DEFAULT)+")";

/* ---------- notes (gardées sur l'appareil) ---------- */
const NKEY="sdm_notes";
const allNotes=()=>lsGet(NKEY,{});
function saveNote(day,ref,text){ const n=allNotes(); if(text.trim()) n[day]={ref,text,updated:Date.now()}; else delete n[day]; return lsSet(NKEY,n); }

/* ---------- minuteur ---------- */
let tMin=5,tLeft=300,tRun=false,tId=null;
function tDraw(){ const c=$("#clock"); if(!c) return;
  c.textContent=tLeft===0?"Amen":String(Math.floor(tLeft/60)).padStart(2,"0")+":"+String(tLeft%60).padStart(2,"0");
  c.classList.toggle("run",tRun); $("#tgo").textContent=tRun?"Pause":tLeft===0?"Recommencer":"Commencer";
  document.querySelectorAll(".durs button").forEach(b=>b.classList.toggle("on",+b.dataset.m===tMin)); }
function tStop(){ tRun=false; clearInterval(tId); }

/* ---------- vues ---------- */
function renderDay(){
  const now=new Date(), day=iso(now), v=verseOfDay(now), note=(allNotes()[day]||{}).text||"";
  app.innerHTML=`
    <div class="kick">Verset du jour</div><div class="day">${esc(fmt(day))}</div>
    <h1>Parole &amp; Prière</h1>
    <section class="vcard"><div class="vt">« ${esc(v.text)} »</div><div class="vr">${esc(refOf(v))}</div>
      <div class="acts"><button class="pb" id="share">📖 Partager le verset</button></div></section>
    <h2>Méditer</h2><p class="refl">${esc(v.reflection)}</p>
    ${v.thought?`<p class="thought"><b>Pensée du jour : </b>${esc(v.thought)}</p>`:""}
    <div class="by">Méditation proposée par Avel Lumière</div>
    <section class="silence"><div style="font-size:.9rem;color:var(--muted)">Temps de silence avec Dieu</div>
      <div class="clock" id="clock"></div><div class="durs">${[2,5,10].map(m=>`<button data-m="${m}">${m} min</button>`).join("")}</div>
      <button class="pb on" id="tgo" style="padding:12px 30px;font-weight:600"></button></section>
    <section class="prayer"><h2>Prière</h2><p>${esc(v.prayer)}</p></section>
    <section class="notes"><h2>Mes notes</h2>
      <p class="hint">Votre page blanche : ce que ce verset vous inspire, ce que vous voulez confier à Dieu… Vos notes restent sur cet appareil et ne sont lues par personne d'autre.</p>
      <textarea id="note" placeholder="Écrire ici…">${esc(note)}</textarea>
      <div class="row"><span class="saved" id="saved">${note?"Enregistré sur cet appareil":""}</span>
      <span><button class="link" id="copyNote">Copier mes notes</button></span></div></section>
    <div class="foot">
      <button class="link" id="goNotes">📒 Toutes mes notes</button>
      <button class="link" id="goDon">💝 Soutenir La Source du Matin</button>
    </div>`;
  tDraw();
  document.querySelectorAll(".durs button").forEach(b=>b.onclick=()=>{ tMin=+b.dataset.m; tLeft=tMin*60; tStop(); tDraw(); });
  $("#tgo").onclick=()=>{ if(tRun){ tStop(); tDraw(); return; } if(tLeft===0) tLeft=tMin*60; tRun=true;
    tId=setInterval(()=>{ tLeft=Math.max(0,tLeft-1); if(tLeft===0) tStop(); tDraw(); },1000); tDraw(); };
  $("#share").onclick=()=>copy(`📖 « ${v.text} » — ${refOf(v)}\n\n🌿 Méditez-le avec La Source du Matin :\n${PAGE_URL}`);
  const ta=$("#note"); let h;
  ta.oninput=()=>{ clearTimeout(h); $("#saved").textContent="…"; h=setTimeout(()=>{ $("#saved").textContent = saveNote(day,refOf(v),ta.value) ? (ta.value.trim()?"Enregistré sur cet appareil":"") : "⚠️ Ce navigateur ne peut pas garder vos notes : pensez à les copier."; },500); };
  $("#copyNote").onclick=()=>copy(`📖 « ${v.text} » — ${refOf(v)}\n\n✍️ Mes notes\n${ta.value.trim()}`);
  $("#goNotes").onclick=()=>go("notes"); $("#goDon").onclick=()=>go("soutenir");
}
function renderNotes(){
  const n=allNotes(), days=Object.keys(n).sort().reverse();
  app.innerHTML=`<div class="top"><button class="chip" id="back">← Verset du jour</button></div>
    <h1 style="margin-top:0">Mes notes</h1>
    ${days.length?days.map(d=>`<div class="item"><div class="d">${esc(fmt(d))}</div><div class="r">${esc(n[d].ref)}</div><div class="n">${esc(n[d].text)}</div>
      <div style="text-align:right;margin-top:6px"><button class="link" data-c="${d}">Copier</button> · <button class="link" data-x="${d}" style="color:#a1442f">Effacer</button></div></div>`).join("")
    : `<div class="empty">Vous n'avez pas encore écrit de notes.<br>Elles apparaîtront ici, jour après jour.</div>`}
    <p style="font-size:.82rem;color:var(--muted);text-align:center">Vos notes sont gardées uniquement sur cet appareil, dans ce navigateur.</p>`;
  $("#back").onclick=()=>go("");
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ const x=n[b.dataset.c]; copy(`${x.ref}\n\n${x.text}`); });
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    if(b.dataset.ok){ const m=allNotes(); delete m[b.dataset.x]; lsSet(NKEY,m); renderNotes(); toast("Note effacée"); }
    else { b.dataset.ok="1"; b.textContent="Toucher encore pour effacer"; } });
}
function renderDon(){
  app.innerHTML=`<div class="top"><button class="chip" id="back">← Verset du jour</button></div>
    <h1 style="margin-top:0">Soutenir</h1>
    <section class="don">
      <p style="font:500 1.3rem/1.5 var(--serif);color:var(--ink)">La Source du Matin est et restera gratuite.</p>
      <p>Chaque jour, un verset, une méditation et une prière sont préparés avec soin pour vous accompagner dans votre marche avec Dieu.</p>
      <p>Si cette page vous fait du bien et que vous souhaitez soutenir ce service, vous pouvez faire un don, du montant de votre choix. Merci du fond du cœur.</p>
      ${DON_URL?`<a class="big" href="${esc(DON_URL)}" target="_blank" rel="noopener">💝 Faire un don</a>`:`<p style="margin-top:16px;font-weight:600;color:var(--green)">La page de don arrive très bientôt.</p>`}
      <p style="font-size:.85rem;margin-top:18px">« Que chacun donne comme il l'a résolu en son cœur, sans tristesse ni contrainte ; car Dieu aime celui qui donne avec joie. » — 2 Corinthiens 9:7 (LSG)</p>
    </section>`;
  $("#back").onclick=()=>go("");
}
function go(h){ tStop(); h=h||"jour"; if(location.hash!=="#"+h) location.hash=h; render(); window.scrollTo(0,0); }
function render(){ const h=location.hash.slice(1); if(h==="notes") renderNotes(); else if(h==="soutenir") renderDon(); else renderDay(); }
window.addEventListener("hashchange",()=>{ tStop(); render(); window.scrollTo(0,0); });
render();
})();
</script>
</body>
</html>
