<style>
:root{--bg:oklch(0.97 0.015 150);--fg:oklch(0.3 0.04 160);--primary:oklch(0.52 0.07 160);--primary-fg:oklch(0.98 0.01 150);--secondary:oklch(0.92 0.025 150);--accent:oklch(0.88 0.04 150);--muted:oklch(0.5 0.03 160);--card:oklch(1 0 0)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Karla,system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--fg);background:var(--bg)}
main{position:relative;min-height:100vh;padding:32px 24px;background-color:var(--bg);background-image:url(fond-meditation.jpg);background-size:cover;background-position:center;background-attachment:fixed}
@media(max-width:700px){main{background-attachment:scroll}}
.tint{position:absolute;inset:0;pointer-events:none;transition:background-color .7s}
.wrap{position:relative;max-width:672px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{text-align:center}
.kick{margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.date{margin:4px 0 0;font-size:14px;color:var(--muted);text-transform:capitalize}
h1{margin:8px 0 0;font:600 36px/1.1 "Cormorant Garamond",serif}
h2{margin:0;font:600 24px/1.2 "Cormorant Garamond",serif}
.btn{display:inline-block;background:transparent;border:1px solid color-mix(in oklab,var(--primary) 30%,transparent);border-radius:999px;padding:8px 20px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer;transition:background .2s}
.btn:hover{background:var(--accent)}
.verse{border-radius:24px;background:color-mix(in oklab,var(--card) 70%,transparent);padding:32px;text-align:center;box-shadow:0 20px 60px -10px color-mix(in oklab,var(--primary) 45%,transparent)}
.vt{margin:0;font:400 20px/1.375 "Cormorant Garamond",serif}
.vr{margin:16px 0 0;font-size:14px;font-weight:500;letter-spacing:.025em;color:var(--primary)}
.verse .btn{margin-top:24px}
.refl{margin:8px 0 0;white-space:pre-line;color:var(--muted)}
.thought{margin:24px 0 0;border-left:2px solid var(--primary);padding-left:16px;color:var(--muted)}
.thought b{font-weight:500;color:var(--fg)}
.sig{margin:16px 0 0;text-align:right;font-size:12px;color:var(--muted)}
.prayer{border-left:2px solid var(--primary);padding-left:20px}
.prayer p{margin:8px 0 0;font-style:italic;line-height:1.625}
.sub{display:flex;flex-direction:column;align-items:center;gap:16px;border-radius:24px;background:var(--secondary);padding:24px;text-align:center}
.sub h2{font-size:20px}
.sub p{margin:0;font-size:14px;color:var(--muted)}
.cta{border-radius:999px;background:var(--primary);color:var(--primary-fg);padding:12px 32px;font-weight:500;text-decoration:none;text-align:center}
.cta:hover{opacity:.9}
.prev ul{list-style:none;margin:8px 0 0;padding:0}
.prev li+li{border-top:1px solid color-mix(in oklab,var(--primary) 20%,transparent)}
.prev li button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;background:none;border:0;padding:12px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.prev .d{text-transform:capitalize;color:var(--muted)}
.prev .r{color:var(--primary)}
.center{text-align:center;margin-top:8px}
.foot{margin:16px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.foot a{color:var(--primary);text-underline-offset:2px}
</style>
</head>

"accroche": "Déposer ses fardeaux auprès de Jésus",
"text": "Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.",

"reflection": "L'inquiétude est un fardeau que nous ne sommes pas appelés à porter seuls. Paul nous invite à un échange précieux : remettre chaque souci entre les mains de Dieu, et recevoir en retour sa paix. Ce matin, prenez le temps de nommer devant le Seigneur ce qui pèse sur votre cœur — une décision, une relation, une crainte pour l'avenir. Présentez-lui chaque chose, non pas avec des mots parfaits, mais avec un cœur sincère et reconnaissant. Car la gratitude ouvre la porte à la paix : lorsque nous nous souvenons de tout ce que Dieu a déjà accompli, nos inquiétudes perdent de leur force. Alors la paix de Dieu, qui dépasse tout ce que nous pouvons comprendre, monte la garde autour de notre cœur et de nos pensées, comme une sentinelle fidèle. Elle ne dépend pas des circonstances, mais de la présence du Christ en nous.",

// Jours qui ont une image d'aperçu (og/AAAA-MM-JJ.jpg) et une page de partage (j/AAAA-MM-JJ/).
const OG_DATES = ["2026-11-04", "2026-11-05", "2026-11-06", "2026-11-07", "2026-11-08", "2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13", "2026-11-14", "2026-11-15"];

const DAY_COLORS=[
  {overlay:"rgba(250, 238, 200, 0.42)",card:"rgba(252, 244, 222, 0.85)"},
  {overlay:"rgba(186, 220, 245, 0.42)",card:"rgba(220, 237, 250, 0.85)"},
  {overlay:"rgba(215, 200, 240, 0.42)",card:"rgba(234, 226, 248, 0.85)"},
  {overlay:"rgba(190, 215, 190, 0.42)",card:"rgba(222, 236, 220, 0.85)"},
  {overlay:"rgba(250, 210, 180, 0.42)",card:"rgba(252, 230, 214, 0.85)"},
  {overlay:"rgba(242, 200, 210, 0.42)",card:"rgba(248, 226, 232, 0.85)"},
  {overlay:"rgba(250, 236, 170, 0.42)",card:"rgba(252, 245, 210, 0.85)"}];

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(s+"T12:00:00"));
const dayColor=s=>DAY_COLORS[new Date(s+"T12:00:00").getDay()];
const TODAY=isoOf(new Date());

function previousVerses(){ return VERSES.filter(v=>v.date&&v.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date)); }
function verseOfDay(){
  const dated=VERSES.find(v=>v.date===TODAY); if(dated) return dated;
  const und=VERSES.filter(v=>!v.date);
  if(!und.length){ return previousVerses()[0]||VERSES[0]; }
  const day=Math.floor(Date.now()/86400000); return und[day%und.length];
}
function shareLink(){ return OG_DATES.includes(TODAY)? SITE_URL+"j/"+TODAY+"/" : SITE_URL+"?jour="+TODAY; }

let archived=null, showOlder=false, copied=false;

function render(){
  const v=archived||verseOfDay(), prev=previousVerses(), col=dayColor(archived?archived.date:TODAY);
  $("#tint").style.backgroundColor=col.overlay;
  const list=(showOlder?prev:prev.slice(0,1));
  app.innerHTML=`<header>
      <p class="kick">${archived?"Méditation précédente":"Verset du jour"}</p>
      <p class="date">${esc(fmt(archived?archived.date:TODAY))}</p>
      <h1>Parole et Lumière</h1>
      ${archived?`<button class="btn" id="back" style="margin-top:12px">Revenir au verset du jour</button>`:""}
    </header>
    <section class="verse"><p class="vt">« ${esc(v.text)} »</p><p class="vr">${esc(v.ref)}</p>
      <button class="btn" id="share">${copied?"✓ Lien copié !":"⤴ Partager le verset"}</button></section>
    <section><h2>Méditer</h2><p class="refl">${esc(v.reflection)}</p>
      ${v.thought?`<p class="thought"><b>Pensée du jour : </b>${esc(v.thought)}</p>`:""}
      <p class="sig">Méditation by Avel Lumière</p></section>
    <section class="prayer"><h2>Prière</h2><p>${esc(v.prayer)}</p></section>
    <section class="sub" aria-label="S'abonner à la méditation quotidienne" style="background-color:${col.card}">
      <h2>Recevez la méditation chaque matin</h2>
      <p>Suivez Avel Lumière sur WhatsApp : un verset, une méditation et une prière chaque jour.</p>
      <a class="cta" href="${WHATSAPP_CHANNEL}" target="_blank" rel="noopener">🔔 S'abonner à la méditation quotidienne</a></section>
    <section class="prev"><h2>Méditations précédentes</h2>
      <ul>${list.map(p=>`<li><button data-d="${p.date}" aria-pressed="${archived&&archived.date===p.date}"><span class="d">${esc(fmt(p.date))}</span><span class="r">${esc(p.ref)}</span></button></li>`).join("")}</ul>
      ${prev.length>1?`<div class="center"><button class="btn" id="older" aria-expanded="${showOlder}">${showOlder?"Masquer les méditations précédentes ▴":"Lire les méditations précédentes ▾"}</button></div>`:""}
      <p class="foot">Recevez chaque matin la méditation : <a href="${WHATSAPP_CHANNEL}" target="_blank" rel="noopener">suivez Avel Lumière sur WhatsApp</a></p></section>`;
  const b=$("#back"); if(b) b.onclick=()=>{ archived=null; copied=false; render(); window.scrollTo(0,0); };
  $("#share").onclick=share;
  const o=$("#older"); if(o) o.onclick=()=>{ showOlder=!showOlder; render(); };
  app.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{ archived=VERSES.find(p=>p.date===x.dataset.d); copied=false; render(); window.scrollTo(0,0); });
}
async function share(){
  const text=shareLink();
  if(navigator.share){ try{ await navigator.share({url:text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); }
  catch(_){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
  copied=true; render(); setTimeout(()=>{ copied=false; render(); },2000);
}
render();
})();
</script>
</body>
</html>
