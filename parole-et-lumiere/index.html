<style>
:root{--ink:#2e3a6e;--fg:#3a4262;--muted:#6a6f86;--gold:#c9893b;--gold-soft:rgba(201,137,59,.14);--card:rgba(255,255,255,.78);--line:rgba(46,58,110,.12)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.65 "Nunito Sans",system-ui,sans-serif;color:var(--fg);background:#fdf6ec}
main{position:relative;min-height:100vh;padding:0 0 40px;background:linear-gradient(180deg,#fdf6ec 0%,#fbe7d6 30%,#f3e4ee 65%,#e7e8f6 100%)}
.tint{position:fixed;inset:0;pointer-events:none;transition:background-color .6s;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:22px}
header{text-align:center;padding:38px 0 6px;position:relative}
.sun{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle,#ffe2a8 0%,#f6c27a 55%,rgba(246,194,122,0) 72%);box-shadow:0 0 60px 18px rgba(246,194,122,.35)}
h1{margin:0;font:600 2.3rem/1.1 "Lora",serif;color:var(--ink)}
h1:after{content:"";display:block;width:56px;height:3px;border-radius:3px;background:var(--gold);margin:12px auto 0}
.kick{margin:14px 0 0;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.date{margin:2px 0 0;font-size:.95rem;color:var(--muted);text-transform:capitalize}
h2{margin:0;display:flex;align-items:center;gap:10px;font:600 1.3rem/1.2 "Lora",serif;color:var(--ink)}
h2 .ic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold-soft);font-size:1rem}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer}
.btn:hover{background:#fff}
.verse{position:relative;border-radius:26px;background:var(--card);padding:34px 24px 26px;text-align:center;border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 44px -18px rgba(46,58,110,.35)}
.verse:before{content:"“";position:absolute;top:-6px;left:18px;font:600 5rem/1 "Lora",serif;color:var(--gold);opacity:.35}
.vt{margin:0;font:italic 500 1.28rem/1.55 "Lora",serif;color:var(--ink)}
.vr{display:inline-block;margin:18px 0 0;padding:4px 14px;border-radius:999px;background:var(--gold-soft);color:#9a6427;font-weight:700;font-size:.85rem;letter-spacing:.03em}
.verse .actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card{border-radius:22px;background:rgba(255,255,255,.55);padding:22px 20px;border:1px solid rgba(255,255,255,.8)}
.refl{margin:10px 0 0;white-space:pre-line}
.thought{margin:18px 0 0;padding:14px 16px;border-radius:14px;background:var(--gold-soft);color:var(--fg);font-size:.95rem}
.thought b{color:#9a6427}
.sig{margin:12px 0 0;text-align:right;font-size:.8rem;color:var(--muted);font-style:italic}
.prayer p{margin:10px 0 0;font:italic 500 1.08rem/1.65 "Lora",serif;color:var(--ink)}
.prayer .amen{display:block;margin-top:10px;text-align:center;color:var(--gold);letter-spacing:.3em;font-size:.8rem}
.sub{text-align:center;font-size:.92rem;color:var(--muted)}
.sub a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.prev ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.prev li button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.prev li button:after{content:"›";color:var(--gold);font-size:1.4rem;line-height:1}
.prev .d{display:block;text-transform:capitalize;color:var(--muted);font-size:.85rem}
.prev .r{display:block;color:var(--ink);font-weight:600}
.center{text-align:center;margin-top:12px}
.foot{margin-top:6px;text-align:center;font-size:.85rem;color:var(--muted)}
.foot .g{display:inline-block;background:var(--gold-soft);color:#9a6427;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* Lecture agréable : méditation, pensée et prière justifiées, avec coupure des mots en français */
.refl,.thought,.prayer p{text-align:justify}
.refl,.thought,.prayer p{hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty;word-spacing:.02em}
.weekly-message{text-align:center;margin:.8rem 0;padding:.5rem;border-radius:10px;background:#fff5dc;color:#42321c}.weekly-message small{font-size:.85rem}
</style>

// Jours qui ont une image d'aperçu (og/AAAA-MM-JJ.jpg) et une page de partage (j/AAAA-MM-JJ/).
const OG_DATES = ["2026-11-04", "2026-11-05", "2026-11-06", "2026-11-07", "2026-11-08", "2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13", "2026-11-14", "2026-11-15", "2026-11-16", "2026-11-18", "2026-11-19", "2026-11-20"];

const DAY_COLORS=[
  {overlay:"rgba(250, 238, 200, 0.42)",card:"rgba(252, 244, 222, 0.85)"},
  {overlay:"rgba(186, 220, 245, 0.42)",card:"rgba(220, 237, 250, 0.85)"},
  {overlay:"rgba(215, 200, 240, 0.42)",card:"rgba(234, 226, 248, 0.85)"},
  {overlay:"rgba(190, 215, 190, 0.42)",card:"rgba(222, 236, 220, 0.85)"},
  {overlay:"rgba(250, 210, 180, 0.42)",card:"rgba(252, 230, 214, 0.85)"},
  {overlay:"rgba(242, 200, 210, 0.42)",card:"rgba(248, 226, 232, 0.85)"},
  {overlay:"rgba(250, 236, 170, 0.42)",card:"rgba(252, 245, 210, 0.85)"}];

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])).replace(/ ([;:!?»])/g,"\u202F$1").replace(/« /g,"«\u202F"); // espaces fines insécables : jamais de « : » ou « ; » seul en début de ligne
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date(s+"T12:00:00"));
// Couleur pastel propre à chaque verset (champ "couleur"), sinon couleur du jour de la semaine.
const pastel=hex=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},0.5)`;};
const dayColor=s=>DAY_COLORS[new Date(s+"T12:00:00").getDay()];
const TODAY=isoOf(new Date());

function previousVerses(){ return VERSES.filter(v=>v.date&&v.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date)); }
function weeklyMessage(day){ return day >= "2026-11-23" && day <= "2026-11-29" ? "<p class=\"weekly-message\"><small>Message de la semaine</small><br><strong>Fortifie-toi et prends courage</strong></p>" : ""; }
function verseOfDay(){
  const dated=VERSES.find(v=>v.date===TODAY); if(dated) return dated;
  const und=VERSES.filter(v=>!v.date);
  if(!und.length){ return previousVerses()[0]||VERSES[0]; }
  const day=Math.floor(Date.now()/86400000); return und[day%und.length];
}
function shareLink(){ return OG_DATES.includes(TODAY)? SITE_URL+"j/"+TODAY+"/" : SITE_URL+"?jour="+TODAY; }

let archived=null, showOlder=false, copied=false;

function render(){
  const v=archived||verseOfDay(), prev=previousVerses(), col=v.couleur?{overlay:pastel(v.couleur)}:dayColor(archived?archived.date:TODAY);
  $("#tint").style.backgroundColor=col.overlay;
  const list=(showOlder?prev:prev.slice(0,1));
  app.innerHTML=`<header>
      <div class="sun" aria-hidden="true"></div>
      <h1>Parole et Lumière</h1>
      <p class="kick">${archived?"Méditation précédente":"Verset du jour"}</p>
      <p class="date">${esc(fmt(archived?archived.date:TODAY))}</p>
      ${archived?`<button class="btn" id="back" style="margin-top:12px">← Revenir au verset du jour</button>`:""}
    </header>
    ${weeklyMessage(archived?archived.date:TODAY)}<section class="verse"><p class="vt">${esc(v.text)}</p><span class="vr">${esc(v.ref)}</span><p data-avel-visits aria-live="polite"></p>
      <div class="actions"><button class="btn" id="share">${copied?"✓ Lien copié !":"⤴ Partager le verset"}</button>
      <a class="btn" href="${WHATSAPP_CHANNEL}" target="_blank" rel="noopener">🔔 Recevoir chaque matin</a></div></section>
    <section class="card"><h2><span class="ic">🕊️</span>Méditer</h2><p class="refl">${esc(v.reflection)}</p>
      ${v.thought?`<p class="thought"><b>Pensée du jour : </b>${esc(v.thought)}</p>`:""}
      <p class="sig">Méditation by Avel &amp; Lumière</p></section>
    <section class="card prayer"><h2><span class="ic">🙏</span>Prière</h2><p>${esc(v.prayer)}</p></section>
    <div data-avel-reactions="${esc(archived ? archived.date : TODAY)}"></div>
    <section class="prev"><h2><span class="ic">📖</span>Méditations précédentes</h2>
      <ul>${list.map(p=>`<li><button data-d="${p.date}" aria-pressed="${archived&&archived.date===p.date}"><span><span class="d">${esc(fmt(p.date))}</span><span class="r">${esc(p.ref)}</span></span></button></li>`).join("")}</ul>
      ${prev.length>1?`<div class="center"><button class="btn" id="older" aria-expanded="${showOlder}">${showOlder?"Masquer ▴":"Voir toutes les méditations ▾"}</button></div>`:""}</section>
    <p class="sub">Recevez chaque matin la méditation :<br><a href="${WHATSAPP_CHANNEL}" target="_blank" rel="noopener">suivez Avel &amp; Lumière sur WhatsApp</a></p>
    <p class="foot"><span class="g">Gratuit</span><br>Proposé par Avel &amp; Lumière</p>`;
  const b=$("#back"); if(b) b.onclick=()=>{ archived=null; copied=false; render(); window.scrollTo(0,0); };
  $("#share").onclick=share;
  const o=$("#older"); if(o) o.onclick=()=>{ showOlder=!showOlder; render(); };
  app.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{ archived=VERSES.find(p=>p.date===x.dataset.d); copied=false; render(); window.scrollTo(0,0); });
}
async function share(){
  const text=shareLink();
  if(navigator.share){ try{ await navigator.share({url:text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); }
  catch(_){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
  copied=true; render(); setTimeout(()=>{ copied=false; render(); },2000);
}
render();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
<script src="../avel-engagement.js?v=reactions1" defer></script>
</body>
